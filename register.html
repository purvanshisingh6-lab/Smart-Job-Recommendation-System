<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SmartHire - Smart Job Recommendation and Skill Matching System">
<title>Create Account | SmartHire</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="register">
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="nav"></div>
<main id="main">

<section class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-6">
<div class="card-x p-4 p-md-5">
  <h1 class="h3 fw-bold text-center">Create Account</h1>
  <p class="text-center text-muted mb-4">Start matching your skills to real roles.</p>
  <form id="registerForm" novalidate>
    <div class="mb-3"><label for="name" class="form-label">Full Name</label><input id="name" class="form-control" required><div class="invalid-feedback">Enter your name.</div></div>
    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" class="form-control" minlength="6" required><div class="invalid-feedback">At least 6 characters.</div></div>
      <div class="col-md-6 mb-3"><label for="confirm" class="form-label">Confirm Password</label><input type="password" id="confirm" class="form-control" required><div class="invalid-feedback">Passwords must match.</div></div>
    </div>
    <div class="row">
      <div class="col-md-7 mb-3"><label for="qualification" class="form-label">Qualification</label>
        <select id="qualification" class="form-select" required><option value="">Select...</option><option>B.Tech CSE</option><option>B.Tech IT</option><option>BCA</option><option>MCA</option><option>M.Tech</option><option>B.Sc</option></select><div class="invalid-feedback">Pick a qualification.</div></div>
      <div class="col-md-5 mb-3"><label for="experience" class="form-label">Experience (years)</label><input type="number" id="experience" class="form-control" min="0" max="40" step="0.5" value="0" required><div class="invalid-feedback">Enter 0 or more.</div></div>
    </div>
    <button class="btn btn-grad w-100 py-2" type="submit">Create Account</button>
  </form>
  <p class="text-center mt-4 mb-0">Already registered? <a href="login.html">Log in</a></p>
</div></div></div></div></section>

</main>
<footer id="foot"></footer>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
</body>
</html>
