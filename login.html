<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SmartHire - Smart Job Recommendation and Skill Matching System">
<title>Login | SmartHire</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="nav"></div>
<main id="main">

<section class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card-x p-4 p-md-5">
  <h1 class="h3 fw-bold text-center">Welcome Back!</h1>
  <p class="text-center text-muted mb-4">Log in to see your job matches.</p>
  <form id="loginForm" novalidate>
    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" class="form-control" placeholder="you@example.com" required><div class="invalid-feedback">Enter a valid email.</div></div>
    <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" class="form-control" required minlength="6"><div class="invalid-feedback" id="pwErr">Password must be at least 6 characters.</div></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
      <a href="#" id="forgot" class="small">Forgot password?</a>
    </div>
    <button class="btn btn-grad w-100 py-2" type="submit">Login</button>
  </form>
  <p class="text-center mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>
</div></div></div></div></section>

</main>
<footer id="foot"></footer>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
</body>
</html>
