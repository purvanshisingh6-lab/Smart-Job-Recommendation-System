<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SmartHire - Smart Job Recommendation and Skill Matching System">
<title>Dashboard | SmartHire</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="nav"></div>
<main id="main">

<div class="container py-5">
  <h1 class="fw-bold mb-1" id="welcome">Welcome back 👋</h1>
  <p class="text-muted mb-4">Here is how your skills line up with open roles.</p>
  <div class="row g-3 mb-5">
    <div class="col-6 col-lg-3"><div class="card-x p-3 stat-card"><i class="bi bi-briefcase"></i><div><div class="stat-num" id="sRec">0</div><div class="text-muted small">Recommended Jobs</div></div></div></div>
    <div class="col-6 col-lg-3"><div class="card-x p-3 stat-card"><i class="bi bi-speedometer2"></i><div><div class="stat-num" id="sAvg">0%</div><div class="text-muted small">Avg Match</div></div></div></div>
    <div class="col-6 col-lg-3"><div class="card-x p-3 stat-card"><i class="bi bi-lightning-charge"></i><div><div class="stat-num" id="sSkills">0</div><div class="text-muted small">My Skills</div></div></div></div>
    <div class="col-6 col-lg-3"><div class="card-x p-3 stat-card"><i class="bi bi-mortarboard"></i><div><div class="stat-num" id="sLearn">0</div><div class="text-muted small">Skills to Learn</div></div></div></div>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 fw-bold mb-0">Top Recommendations</h2><a href="jobs.html">View all jobs</a></div>
  <div class="row g-4 mb-5" id="topJobs"></div>
  <h2 class="h4 fw-bold mb-3">Skills You Should Learn</h2>
  <div class="card-x p-4 mb-5" id="learn"></div>
  <h2 class="h4 fw-bold mb-3">My Applications</h2>
  <div class="card-x p-4" id="applications" aria-live="polite">Loading applications…</div>
</div>

</main>
<footer id="foot"></footer>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
</body>
</html>
