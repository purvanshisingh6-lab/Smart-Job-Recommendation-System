server.port=${PORT:8080}
spring.application.name=smarthire
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/smarthire;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-deployment-2026}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,https://smart-job-matcher-ebon.vercel.app}
