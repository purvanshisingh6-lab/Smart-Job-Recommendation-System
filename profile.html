<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SmartHire - Smart Job Recommendation and Skill Matching System">
<title>My Profile | SmartHire</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="profile">
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="nav"></div>
<main id="main">

<div class="container py-5">
  <div class="row g-4">
    <div class="col-lg-4"><div class="card-x p-4 text-center h-100">
      <div class="avatar" id="avatar" aria-hidden="true">A</div>
      <h1 class="h4 fw-bold mb-0" id="pName">Name</h1>
      <p class="text-muted" id="pEmail">email</p>
      <div class="row g-2 mt-3">
        <div class="col-4"><div class="mini-stat"><b id="cSkills">0</b><span>Skills</span></div></div>
        <div class="col-4"><div class="mini-stat"><b id="cMatches">0</b><span>Matches</span></div></div>
        <div class="col-4"><div class="mini-stat"><b id="cBest">0%</b><span>Best</span></div></div>
      </div>
    </div></div>
    <div class="col-lg-8"><div class="card-x p-4 h-100">
      <h2 class="h5 fw-bold mb-3">Personal details</h2>
      <form id="detailsForm" novalidate>
        <div class="row">
          <div class="col-md-6 mb-3"><label for="fName" class="form-label">Full name</label><input id="fName" class="form-control" required><div class="invalid-feedback">Required.</div></div>
          <div class="col-md-6 mb-3"><label for="fEmail" class="form-label">Email</label><input id="fEmail" type="email" class="form-control" required><div class="invalid-feedback">Valid email required.</div></div>
          <div class="col-md-6 mb-3"><label for="fQual" class="form-label">Qualification</label><select id="fQual" class="form-select"><option>B.Tech CSE</option><option>B.Tech IT</option><option>BCA</option><option>MCA</option><option>M.Tech</option><option>B.Sc</option></select></div>
          <div class="col-md-6 mb-3"><label for="fExp" class="form-label">Experience (years)</label><input id="fExp" type="number" min="0" max="40" step="0.5" class="form-control" required></div>
        </div>
        <button class="btn btn-grad" type="submit">Save profile</button>
      </form>
    </div></div>
    <div class="col-12"><div class="card-x p-4">
      <h2 class="h5 fw-bold mb-2">Upload resume</h2>
      <p class="text-muted small">Upload a PDF or TXT resume (maximum 5 MB). Detected skills can be added to your profile.</p>
      <form id="resumeForm" class="row g-2 align-items-end">
        <div class="col-md-8"><label for="resumeFile" class="form-label">Resume file</label><input id="resumeFile" type="file" class="form-control" accept=".pdf,.txt" required></div>
        <div class="col-md-4"><button class="btn btn-grad w-100" type="submit">Analyze Resume</button></div>
      </form><div id="resumeResult" class="small mt-3" aria-live="polite"></div>
    </div></div>
    <div class="col-12"><div class="card-x p-4">
      <h2 class="h5 fw-bold mb-3">My skills</h2>
      <div id="skillList" class="d-flex flex-wrap gap-2 mb-3" aria-live="polite"></div>
      <form id="skillForm" class="row g-2">
        <div class="col"><label for="skillInput" class="visually-hidden">Add a skill</label><input id="skillInput" class="form-control" list="masterSkills" placeholder="Choose or type a skill" autocomplete="off"><datalist id="masterSkills"><option value="JavaScript"><option value="TypeScript"><option value="React"><option value="Next.js"><option value="Node.js"><option value="HTML/CSS"><option value="Tailwind"><option value="Python"><option value="SQL"><option value="Pandas"><option value="Machine Learning"><option value="Statistics"><option value="Data Visualization"><option value="Figma"><option value="User Research"><option value="Prototyping"><option value="Copywriting"><option value="SEO"><option value="AWS"><option value="Docker"><option value="CI/CD"><option value="Linux"><option value="Git"><option value="Communication"><option value="Project Management"></datalist></div>
        <div class="col-auto"><button class="btn btn-grad" type="submit"><i class="bi bi-plus-lg"></i> Add</button></div>
      </form>
    </div></div>
  </div>
</div>

</main>
<footer id="foot"></footer>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
</body>
</html>
